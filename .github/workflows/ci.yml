name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend lint & compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .
          pip install ruff

      - name: Lint (ruff)
        run: ruff check app

      - name: Compile / import check
        run: python -m compileall -q app

      - name: App boots
        run: python -c "from app.main import app; assert len(app.openapi()['paths']) > 0"

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
