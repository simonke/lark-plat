services:
  postgres:
    image: postgres:16-alpine
    container_name: lark-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see backend/.env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-lark_plat}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lark -d lark_plat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lark-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    container_name: lark-backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-lark}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lark_plat}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    restart: unless-stopped

  celery_worker:
    build:
      context: ../backend
    container_name: lark-celery-worker
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-lark}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lark_plat}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO
    restart: unless-stopped

  celery_beat:
    build:
      context: ../backend
    container_name: lark-celery-beat
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-lark}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lark_plat}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: lark-web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
