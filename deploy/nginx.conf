server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Docker embedded DNS. Resolve "backend" at request time so an upstream
    # container recreated with a new IP (e.g. `--force-recreate backend`) does
    # not leave nginx pinned to a stale address (all /api -> 502). A static
    # `proxy_pass http://backend:8000;` is resolved once at startup and cached.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_backend "http://backend:8000";

    # WebSocket gateways
    location /api/v1/ws/ {
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /api/v1/agent/ {
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /docs {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
