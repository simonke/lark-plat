# lark-plat NATIVE (non-Docker) reverse proxy.
#
# Use this file for a host-installed Nginx. It mirrors deploy/nginx.conf but
# points at a locally running backend and a host static root, so it MUST NOT be
# used with Docker Compose (which needs the service name `backend`).
#   - deploy/nginx.conf        -> Docker Compose web container (backend:8000)
#   - deploy/nginx.native.conf -> native host Nginx (127.0.0.1:8000)  <-- this file
#
# Replace <your-domain> and the TLS cert paths before use; WSS requires TLS.

server {
    listen 443 ssl http2;
    server_name <your-domain>;

    ssl_certificate     /etc/nginx/ssl/larkplat.crt;
    ssl_certificate_key /etc/nginx/ssl/larkplat.key;

    client_max_body_size 20m;

    # WebSocket gateways
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /api/v1/agent/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location / {
        root /var/www/lark-plat/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# Optional: redirect plain HTTP to HTTPS.
# server {
#     listen 80;
#     server_name <your-domain>;
#     return 301 https://$host$request_uri;
# }
